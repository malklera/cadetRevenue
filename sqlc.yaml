version: "2"
sql:
  - schema: "sql/schema"
    queries: "sql/queries"
    engine: "sqlite"
    gen:
      go:
        out: "internal/database"
        overrides:
          - column: "entry.date"
            go_type:
              import: "time"
              type: "Time"
          - column: "entry.id"
            go_type:
              import: "github.com/gofrs/uuid/v5"
              type: "UUID"
          - column: "movement.id"
            go_type:
              import: "github.com/gofrs/uuid/v5"
              type: "UUID"
          - column: "movement.entry_id"
            go_type:
              import: "github.com/gofrs/uuid/v5"
              type: "UUID"
